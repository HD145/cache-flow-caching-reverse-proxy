server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: caching-proxy
  lifecycle:
    timeout-per-shutdown-phase: 15s
  data:
    redis:
      # Use REDIS_URL (redis:// or rediss://user:pass@host:port) in hosted environments
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 2s
      connect-timeout: 2s

proxy:
  backend-url: ${PROXY_BACKEND_URL:https://jsonplaceholder.typicode.com}
  admin-token: ${PROXY_ADMIN_TOKEN:}
  max-body-bytes: ${PROXY_MAX_BODY_BYTES:10485760}
  timeouts:
    connection-ms: ${PROXY_CONNECT_TIMEOUT_MS:5000}
    read-ms: ${PROXY_READ_TIMEOUT_MS:5000}
  pool:
    max-connections: ${PROXY_MAX_CONNECTIONS:500}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: false   # cache is optional; proxy degrades gracefully when Redis is down
